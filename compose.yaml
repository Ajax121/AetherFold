name: aetherfold

services:
  app:
    image: aetherfold:local
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${AETHERFOLD_BIND_HOST:-127.0.0.1}:${AETHERFOLD_PORT:-8080}:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
