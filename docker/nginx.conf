server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    autoindex off;
    charset utf-8;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    # Filenames are not content-hashed, so revalidate after an app update.
    add_header Cache-Control "no-cache" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ /\. {
        return 404;
    }

    location / {
        # Missing scripts/images must be 404s, not the app's HTML document.
        try_files $uri $uri/ =404;
    }
}
